




# Development-only addition to the existing Norhnaim Sail Docker Compose.
# Start with BOTH compose files (see README_RU.md).
services:
  reverb:
    image: sail-8.5/app
    restart: unless-stopped
    init: true
    environment:
      WWWUSER: "${WWWUSER:-1000}"
      LARAVEL_SAIL: "1"
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${REVERB_PUBLIC_PORT:-8081}:8080"
    networks:
      - sail
    depends_on:
      laravel.test:
        condition: service_healthy

  laboratory-broadcast-worker:
    image: sail-8.5/app
    restart: unless-stopped
    init: true
    environment:
      WWWUSER: "${WWWUSER:-1000}"
      LARAVEL_SAIL: "1"
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--queue=laboratory-broadcasts", "--sleep=1", "--tries=3", "--backoff=2", "--timeout=30", "--memory=256"]
    volumes:
      - .:/var/www/html
    networks:
      - sail
    depends_on:
      laravel.test:
        condition: service_healthy
      redis:
        condition: service_healthy

