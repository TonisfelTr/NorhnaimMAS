# nginx.conf is included within nginx's "http" context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/mobile.crt;
    ssl_certificate_key /etc/nginx/tls/mobile.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Personal invitation links are server-verified on /session; never cache responses.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # /session?token=... contains a bearer credential. Do not log request URLs.
    # Python signaling checks the HMAC signature and expiration before serving HTML.
    location = /session {
        access_log off;
        proxy_pass http://telemedicine-signaling:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://telemedicine-signaling:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name video-norhnaim.duckdns.org;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/public.crt;
    ssl_certificate_key /etc/nginx/tls/public.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # /session?token=... contains a bearer credential. Do not log request URLs.
    # Python signaling checks the HMAC signature and expiration before serving HTML.
    location = /session {
        access_log off;
        proxy_pass http://telemedicine-signaling:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://telemedicine-signaling:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Redirect old external /demo links to /session.
    location = /demo {
        return 302 /session$is_args$args;
    }

    # Browser-side fragment gate redirects here; respond with real HTTP 403.
    # Do not put bearer tokens in query strings to enforce this guard.
    location = /session-denied {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 403 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Норхнейм — доступ запрещён</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,sans-serif;background:#f4f8fa;color:#183a49}main{max-width:460px;margin:20px;padding:34px;border:1px solid #dde8ed;border-radius:18px;background:#fff;box-shadow:0 15px 50px rgba(14,42,53,.07)}h1{font-size:25px;line-height:1.25;margin:0 0 12px}p{margin:0;color:#526878}img{height:44px;margin-bottom:16px}</style></head><body><main><img src="/brand/norhneim-viking-mark.png" alt="Норхнейм"><h1>Доступ к видеосеансу закрыт</h1><p>Для подключения нужна персональная ссылка-приглашение. Откройте ссылку, полученную от клиники.</p></main></body></html>';
    }
}
